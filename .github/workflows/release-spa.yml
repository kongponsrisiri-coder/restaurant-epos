name: Release Spa

# SiamEPOS SPA desktop installer pipeline — completely separate from the
# restaurant pipeline (release.yml).
#
#   - Restaurant releases trigger on  `v*`     tags  → restaurant-epos releases
#   - Spa releases trigger on         `spa-v*` tags  → siamepos-spa-releases
#
# `v*` does NOT match `spa-v*` (different first character), so tagging the
# spa never fires the restaurant build and vice-versa.
#
# Phase B: the spa desktop app now runs its OWN local server on an encrypted
# SQLite DB (offline-capable), so the build bundles the React client + the
# server + node_modules and rebuilds the native SQLCipher module
# (better-sqlite3-multiple-ciphers) for Electron's ABI. Hence we install the
# root, client AND electron dependencies, and `npm run build:mac/win` chains
# build:client → rebuild:native → electron-builder. VITE_API_BASE is set empty
# so the bundled client calls the local server same-origin.
#
# ── Prerequisites ────────────────────────────────────────────────────
#   NONE beyond what the restaurant build already has. This publishes to THIS
#   repo with the built-in GITHUB_TOKEN (no Personal Access Token, no separate
#   releases repo). The Apple signing secrets (MAC_CERT_P12_BASE64,
#   MAC_CERT_PASSWORD, MAC_APPLE_ID, MAC_APPLE_APP_PASSWORD, MAC_TEAM_ID) already
#   live here for the restaurant build and are reused automatically.
#
#   Spa releases are tagged `spa-v*` and published as PRERELEASES, so they
#   never collide with the restaurant's stable `v*` releases / auto-update.
#
# Cut a release:   git tag spa-v0.1.0 && git push origin spa-v0.1.0

on:
  push:
    tags:
      - 'spa-v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Mac ────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spa-epos/electron/package-lock.json

      - name: Install dependencies (root + client + electron)
        run: |
          cd spa-epos && npm install
          cd client && npm install && cd ..
          cd electron && npm install

      - name: Import Apple Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Build Mac DMG
        run: |
          cd spa-epos/electron
          npm run build:mac
        env:
          VITE_API_BASE:               ''
          CSC_LINK:                    ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD:            ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID:                    ${{ secrets.MAC_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.MAC_TEAM_ID }}

      - name: Upload DMG + update manifest
        uses: actions/upload-artifact@v5
        with:
          name: spa-mac-installer
          path: |
            spa-epos/electron/dist-electron/*.dmg
            spa-epos/electron/dist-electron/*.blockmap
            spa-epos/electron/dist-electron/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # ── Windows ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spa-epos/electron/package-lock.json

      - name: Install dependencies (root + client + electron)
        run: |
          cd spa-epos && npm install
          cd client && npm install && cd ..
          cd electron && npm install

      - name: Build Windows installer
        run: |
          cd spa-epos/electron
          npm run build:win
        env:
          VITE_API_BASE: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE + update manifest
        uses: actions/upload-artifact@v5
        with:
          name: spa-windows-installer
          path: |
            spa-epos/electron/dist-electron/*.exe
            spa-epos/electron/dist-electron/*.blockmap
            spa-epos/electron/dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 14

  # ── Release (publishes to THIS repo, like the restaurant build) ─────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    # Publishes to this same repo using the built-in GITHUB_TOKEN — exactly like
    # the restaurant release.yml, so no Personal Access Token is needed. Spa
    # releases are marked `prerelease: true` so the RESTAURANT's auto-updater
    # (which only looks at stable releases) never picks them up, and vice-versa
    # (the spa app sets allowPrerelease so it only reads its own spa-v* builds).
    permissions:
      contents: write
    # Publish on a spa-v* tag as long as AT LEAST ONE platform built — a failure
    # on the other must not block shipping the installer that did build.
    if: always() && startsWith(github.ref, 'refs/tags/spa-v') &&
        (needs.build-mac.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Show downloaded files
        run: ls -laR dist

      - name: Publish SiamEPOS Spa release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SiamEPOS Spa ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/spa-mac-installer/*.dmg
            dist/spa-mac-installer/*.blockmap
            dist/spa-mac-installer/latest-mac.yml
            dist/spa-windows-installer/*.exe
            dist/spa-windows-installer/*.blockmap
            dist/spa-windows-installer/latest.yml
