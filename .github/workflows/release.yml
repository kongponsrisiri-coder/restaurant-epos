name: Release

# Triggers:
#   - git tag push (v*)        → builds both installers + creates a Release
#   - manual workflow_dispatch → builds both installers, skips the Release job
#                                (useful for dry runs / debugging)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Some action versions still declare Node 20 in their metadata; this opts
  # everything onto Node 24 per GitHub's own deprecation guidance.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Version guard (SEPOS-PRO-004) ──────────────────────────────────
  # electron-updater compares versions; if the tag doesn't match
  # electron/package.json the release would offer no update (or the wrong
  # one). Fail fast before the ~30-min Mac build if they diverge.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match electron/package.json version
        run: |
          PKG=$(node -p "require('./electron/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "electron/package.json = $PKG   tag = $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match electron/package.json version $PKG — bump the version before tagging."
            exit 1
          fi

  # ── Mac ────────────────────────────────────────────────────────────
  build-mac:
    needs: verify-version
    runs-on: macos-latest
    # 60 min (up from 30). Apple's notary service round-trip takes
    # ~20-30 minutes per build (verified on the v1.6.4 attempt where
    # notarization itself took 29 of 30 allotted minutes, leaving
    # 17 seconds for DMG packaging before the timeout hit). 60
    # minutes gives 25-30 min of headroom even on slow notarization
    # days.
    timeout-minutes: 60
    # SEPOS-NOTARIZE-001 — derive a boolean at job level (where the
    # `secrets` context IS accessible) so the conditional step below
    # can reference `env.HAS_MAC_CERT`. GitHub doesn't allow secrets
    # directly inside step-level `if:` for security reasons.
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20         # Electron 33 bundles Node 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Build React frontend
        run: |
          cd client
          npm install
          npm run build

      - name: Install Electron + rebuild native modules
        run: |
          cd electron
          npm install
          npm run rebuild:native

      # ── SEPOS-NOTARIZE-001 — import Developer ID cert (skipped silently
      # if MAC_CERT_P12_BASE64 secret isn't set; build stays unsigned). ──
      - name: Import Apple Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Build Mac DMG
        run: |
          cd electron
          npm run build:mac
        env:
          # Signing — empty when secrets unset; electron-builder skips
          # signing and produces an unsigned DMG (current behaviour).
          # When set, signs with Developer ID via the imported cert.
          CSC_LINK:         ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization — electron-builder calls notarytool with these
          # when all three are set. Without them, notarize step skipped.
          APPLE_ID:                   ${{ secrets.MAC_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:              ${{ secrets.MAC_TEAM_ID }}

      - name: Show build output (debug)
        run: ls -la electron/dist-electron

      - name: Upload DMG + update manifest
        uses: actions/upload-artifact@v5
        with:
          name: mac-installer
          # .dmg = manual installer, .zip = the archive macOS in-place
          # auto-update (Squirrel.Mac) actually consumes (SEPOS-PRO-006 —
          # DMG-only releases could NOT self-update on Mac), .blockmap = delta
          # map, latest-mac.yml = manifest electron-updater fetches.
          path: |
            electron/dist-electron/*.dmg
            electron/dist-electron/*.zip
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # ── Windows ────────────────────────────────────────────────────────
  build-windows:
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Build React frontend
        run: |
          cd client
          npm install
          npm run build

      - name: Install Electron + rebuild native modules
        run: |
          cd electron
          npm install
          npm run rebuild:native

      - name: Build Windows installer
        run: |
          cd electron
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build output (debug)
        shell: cmd
        run: dir electron\dist-electron /s

      - name: Upload EXE + update manifest
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 14

  # ── Release (only on tag push) ─────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    # Publish on a v* tag as long as WINDOWS built — a Mac failure (e.g. an
    # expired Apple notarization password) must NOT block the Windows release
    # + auto-update. `always()` runs this after both jobs finish regardless of
    # the Mac result; we then require only build-windows to have succeeded.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success'
    permissions:
      contents: write  # required to create / update the Release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Show downloaded files
        run: ls -laR dist

      # Existing tills auto-update from restaurant-epos (their baked-in updater
      # target) — keep publishing here until every till has moved to a build
      # that points at siamepos-releases (SEC-2026-07 repo-privacy transition).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SiamEPOS ${{ github.ref_name }}
          generate_release_notes: true
          # false — so a missing Mac DMG (failed/skipped Mac build) doesn't fail
          # the publish; whatever built (at least Windows) gets attached.
          fail_on_unmatched_files: false
          # Attach the installers AND the electron-updater manifest /
          # blockmap files so existing installs can auto-update.
          files: |
            dist/mac-installer/*.dmg
            dist/mac-installer/*.zip
            dist/mac-installer/*.blockmap
            dist/mac-installer/latest-mac.yml
            dist/windows-installer/*.exe
            dist/windows-installer/*.blockmap
            dist/windows-installer/latest.yml

      # ── SEC-2026-07 transition: ALSO publish to the PUBLIC releases-only repo
      # so tills built to check siamepos-releases get the same release. New
      # builds' updater target is siamepos-releases (electron/package.json).
      # Once every till is migrated, drop the step ABOVE and make restaurant-epos
      # private. Needs RELEASES_REPO_TOKEN secret (PAT with repo scope).
      - name: Publish to public releases repo (siamepos-releases)
        uses: softprops/action-gh-release@v2
        with:
          repository: kongponsrisiri-coder/siamepos-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: SiamEPOS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/mac-installer/*.dmg
            dist/mac-installer/*.zip
            dist/mac-installer/*.blockmap
            dist/mac-installer/latest-mac.yml
            dist/windows-installer/*.exe
            dist/windows-installer/*.blockmap
            dist/windows-installer/latest.yml
