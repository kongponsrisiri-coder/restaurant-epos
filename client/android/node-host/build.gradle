apply plugin: 'com.android.library'

android {
    namespace = "uk.co.siamepos.nodehost"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "27.0.12077973"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        // Sunmi T2s is arm only; keep the APK lean — skip x86/x86_64.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    // Bundle the prebuilt libnode.so for each ABI.
    sourceSets {
        main {
            jniLibs.srcDirs += "libnode/bin"
            assets.srcDirs += "nodejs-assets"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError false
    }

    packaging {
        // Two libnode.so for the two ABIs — keep both.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
}
