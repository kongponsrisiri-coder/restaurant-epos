<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order at your table</title>
<style>
  :root { --brand:#1E4038; --ink:#1a1a2e; --bg:#f6f4ef; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:110px; overflow-x:hidden; }
  header { background:var(--brand); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20; }
  header h1 { font-size:17px; font-weight:800; }
  header .tbl { font-size:13px; opacity:.85; margin-top:2px; }
  .cats { display:flex; gap:8px; overflow-x:auto; padding:10px 12px; position:sticky; top:52px; background:var(--bg); z-index:19; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cat { flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1.5px solid #d8d4ca; background:#fff; font-weight:700; font-size:13px; color:#555; }
  .cat.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .sec-title { font-size:15px; font-weight:800; padding:14px 16px 6px; }
  .item { display:flex; gap:12px; background:#fff; margin:8px 12px; border-radius:14px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .item img { width:78px; height:78px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#eee; }
  .item .info { flex:1; min-width:0; }
  .item .nm { font-weight:700; font-size:14.5px; }
  .item .ds { font-size:12px; color:#777; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip { font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; background:#fde8e8; color:#b02a2a; }
  .chip.diet { background:#e3f2e6; color:#256b34; }
  .rowb { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .pr { font-weight:800; font-size:14.5px; }
  .add { background:var(--brand); color:#fff; border:none; border-radius:10px; font-weight:800; font-size:14px; padding:8px 16px; }
  .qty-pill { background:var(--brand); color:#fff; border-radius:999px; font-weight:800; font-size:12px; padding:3px 9px; }
  .step { display:flex; align-items:center; gap:10px; }
  .step button { width:32px; height:32px; border-radius:9px; border:1.5px solid var(--brand); background:#fff; color:var(--brand); font-size:18px; font-weight:800; }
  .step span { font-weight:800; min-width:16px; text-align:center; }
  .cartbar { position:fixed; left:12px; right:12px; bottom:14px; background:var(--brand); color:#fff; border-radius:16px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:15px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:30; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:flex; align-items:flex-end; }
  .sheet .panel { background:#fff; width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 16px 28px; }
  .panel h2 { font-size:17px; margin-bottom:10px; }
  .grp { margin:14px 0 4px; }
  .grp .gname { font-weight:800; font-size:14px; }
  .grp .greq { font-size:11px; color:#b02a2a; font-weight:700; margin-left:6px; }
  .opt { display:flex; justify-content:space-between; align-items:center; padding:10px 2px; border-bottom:1px solid #f0eee8; font-size:14px; }
  .opt label { display:flex; align-items:center; gap:10px; flex:1; }
  .opt input { width:19px; height:19px; accent-color:var(--brand); }
  .opt .xp { color:#777; font-size:13px; font-weight:700; }
  .cline { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:10px 0; border-bottom:1px solid #eee; }
  .cline .nm { font-weight:700; font-size:14px; }
  .cline .ops { font-size:12px; color:#666; margin-top:2px; }
  .cline .note-in { width:100%; margin-top:6px; padding:8px 10px; border:1.5px solid #ddd; border-radius:9px; font-size:13px; }
  .totrow { display:flex; justify-content:space-between; font-weight:800; font-size:16px; padding:14px 0 6px; }
  .paybtn { width:100%; background:var(--brand); color:#fff; border:none; border-radius:13px; font-weight:800; font-size:16px; padding:15px; margin-top:12px; }
  .paybtn:disabled { opacity:.5; }
  .muted { color:#888; font-size:12px; text-align:center; margin-top:8px; }
  .status-wrap { padding:18px 16px; }
  .bigok { text-align:center; font-size:46px; margin:26px 0 6px; }
  .bigmsg { text-align:center; font-weight:800; font-size:18px; }
  .bigsub { text-align:center; color:#777; font-size:13px; margin-top:4px; }
  .sline { display:flex; justify-content:space-between; padding:11px 4px; border-bottom:1px solid #eee; font-size:14px; gap:8px; }
  .sline .ops { font-size:11.5px; color:#777; }
  .st { font-weight:800; font-size:12px; white-space:nowrap; }
  .st.cooking { color:#c07f00; } .st.cooked { color:#1c74c9; } .st.served { color:#256b34; }
  .morebtn { width:100%; background:#fff; color:var(--brand); border:2px solid var(--brand); border-radius:13px; font-weight:800; font-size:15px; padding:13px; margin-top:16px; }
  .err { background:#fde8e8; color:#b02a2a; border-radius:10px; padding:12px; margin:12px; font-size:13.5px; font-weight:600; }
  #payel { margin-top:12px; }
  /* SiamPay brand bar — the payment step names its payment solution, like any
     hosted checkout's top bar. Copy rule: "powered by Stripe", nothing more. */
  .sp-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding:11px 14px; border:1px solid #e3e6ea; border-radius:12px; background:#fafbfc; }
  .sp-name { font-weight:800; font-size:15.5px; color:#1a1a2e; letter-spacing:.2px; }
  .sp-name b { color:#c9a227; }
  .sp-sub { font-size:12px; color:#6b7280; white-space:nowrap; }
  .sp-sub b { color:#635bff; font-weight:700; }
  .spin { text-align:center; padding:60px 20px; color:#888; }
  /* SEPOS-QR-RECEIPT-001 — a QR customer never touches the till, so there's no
     paper unless they ask. VAT-registered venues must be able to give one and
     people on expenses need it. */
  .rc { background:#fff; border-radius:14px; padding:16px; margin-top:14px; }
  .rc h3 { font-size:16px; margin-bottom:2px; }
  .rc .meta { font-size:12px; color:#777; }
  .rc .line { display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px solid #f1efe9; }
  .rc .tot { display:flex; justify-content:space-between; font-weight:800; font-size:15.5px; padding-top:10px; }
  .rc .em { display:flex; gap:8px; margin-top:14px; }
  .rc .em input { flex:1; padding:11px 12px; border:1.5px solid #ddd; border-radius:10px; font-size:14px; min-width:0; }
  .rc .em button { padding:11px 14px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-weight:800; font-size:14px; }
</style>
</head>
<body>
<div id="app"><div class="spin">Loading the menu…</div></div>
<script>
(function () {
  const token = location.pathname.split('/').pop();
  const $ = (s) => document.querySelector(s);
  let S = null, MENU = [], cart = [], view = 'menu', activeCat = null;
  let optItem = null, optGroups = null, optSel = {};          // options sheet state
  let stripePk = null, stripe = null, elements = null, payBusy = false, uidSeq = 1;
  // Tenders this phone has paid on this table (survives a refresh, dies with
  // the tab — we never identify the customer, we just remember our own).
  let myPayments = [];
  let lastOrderId = null;
  try { myPayments = JSON.parse(sessionStorage.getItem('qr_pays_' + token) || '[]'); } catch (e) { myPayments = []; }
  const modCache = {};

  const fmt = (n) => (S ? S.currency : '£') + Number(n || 0).toFixed(2);
  const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const cartCount = () => cart.reduce((a, c) => a + c.quantity, 0);
  const cartTotal = () => cart.reduce((a, c) => a + c.quantity * c.unit, 0);
  const itemQty = (id) => cart.filter((c) => c.menu_item_id === id).reduce((a, c) => a + c.quantity, 0);

  async function boot() {
    try {
      const s = await fetch('/api/qr/session/' + token).then((r) => r.json());
      if (s.error) return renderFatal(s.error);
      S = s;
      document.documentElement.style.setProperty('--brand', s.brand || '#1E4038');
      const m = await fetch('/api/menu').then((r) => r.json());
      MENU = (Array.isArray(m) ? m : []).filter((c) => (c.items || []).some((i) => Number(i.is_online ?? 1)));
      activeCat = MENU[0] ? MENU[0].id : null;
      if (s.order && s.order.items && s.order.items.length && (s.order.payment_status === 'paid' || s.order.payment_status === 'mock')) view = 'status';
      render();
      setInterval(refreshStatus, 10000);
    } catch (e) { renderFatal('Could not load the menu — please check your connection and rescan the code.'); }
  }

  async function refreshStatus() {
    if (view !== 'status') return;
    // Verify pass (MEDIUM) — don't re-render over an open receipt: the poll
    // used to wipe it, along with any half-typed email address.
    if (document.querySelector('#rcbox .rc')) return;
    try {
      const s = await fetch('/api/qr/session/' + token).then((r) => r.json());
      if (!s.error) { S.order = s.order; if (s.order) lastOrderId = s.order.id; render(); }
    } catch (e) {}
  }

  function renderFatal(msg) { $('#app').innerHTML = '<div class="err">' + esc(msg) + '</div>'; }
  function parseTags(v) { try { const a = JSON.parse(v || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }

  function render() {
    if (view === 'status') return renderStatus();
    const cat = MENU.find((c) => c.id === activeCat) || MENU[0];
    let h = '<header><h1>' + esc(S.restaurant_name) + '</h1><div class="tbl">📍 ' + esc(S.table.label) + ' · order &amp; pay from your seat</div></header>';
    h += '<div class="cats">' + MENU.map((c) => '<button class="cat' + (cat && c.id === cat.id ? ' on' : '') + '" data-cat="' + c.id + '">' + esc(c.name) + '</button>').join('') + '</div>';
    if (cat) {
      const subs = (cat.subcategories || []);
      const groups = subs.length ? subs.map((s) => ({ name: s.name, items: (cat.items || []).filter((i) => i.subcategory_id === s.id) })) : [{ name: null, items: cat.items || [] }];
      const loose = subs.length ? (cat.items || []).filter((i) => !i.subcategory_id) : [];
      if (loose.length) groups.push({ name: 'More', items: loose });
      for (const g of groups) {
        const items = g.items.filter((i) => Number(i.is_online ?? 1) && Number(i.is_available ?? 1));
        if (!items.length) continue;
        if (g.name) h += '<div class="sec-title">' + esc(g.name) + '</div>';
        for (const i of items) h += itemCard(i);
      }
    }
    if (cartCount() > 0) h += '<div class="cartbar" id="cartbar"><span>🧺 ' + cartCount() + ' item' + (cartCount() > 1 ? 's' : '') + '</span><span>View order · ' + fmt(cartTotal()) + '</span></div>';
    if (view === 'cart') h += cartSheet();
    if (optItem) h += optionsSheet();
    $('#app') && ($('#app').innerHTML = h);
    bind();
  }

  function itemCard(i) {
    const q = itemQty(i.id);
    const al = parseTags(i.allergens), dt = parseTags(i.dietary);
    return '<div class="item">' +
      (i.image_url ? '<img loading="lazy" src="' + esc(i.image_url) + '" alt="">' : '') +
      '<div class="info"><div class="nm">' + esc(i.name) + (q ? ' <span class="qty-pill">×' + q + '</span>' : '') + '</div>' +
      (i.description ? '<div class="ds">' + esc(i.description) + '</div>' : '') +
      ((al.length || dt.length) ? '<div class="chips">' + dt.map((t) => '<span class="chip diet">' + esc(t) + '</span>').join('') + al.map((t) => '<span class="chip">⚠ ' + esc(t) + '</span>').join('') + '</div>' : '') +
      '<div class="rowb"><span class="pr">' + fmt(i.price) + '</span>' +
      '<button class="add" data-add="' + i.id + '">Add</button>' +
      '</div></div></div>';
  }

  // ── Options (modifiers) sheet ─────────────────────────────────────────────
  async function startAdd(id) {
    const i = findItem(id); if (!i) return;
    let groups = modCache[id];
    if (groups === undefined) {
      try { groups = await fetch('/api/menu/items/' + id + '/modifiers').then((r) => r.json()); } catch (e) { groups = []; }
      if (!Array.isArray(groups)) groups = [];
      groups = groups.filter((g) => Array.isArray(g.modifiers) && g.modifiers.length);
      modCache[id] = groups;
    }
    if (!groups.length) { pushCart(i, [], []); render(); return; }
    optItem = i; optGroups = groups; optSel = {};
    render();
  }

  function optionsSheet() {
    let h = '<div class="sheet" id="optsheet"><div class="panel"><h2>' + esc(optItem.name) + '</h2>';
    for (const g of optGroups) {
      const multi = Number(g.multi_select);
      h += '<div class="grp"><div><span class="gname">' + esc(g.name) + '</span>' + (Number(g.required) ? '<span class="greq">required</span>' : '') + '</div>';
      for (const m of g.modifiers) {
        const checked = (optSel[g.id] || []).includes(m.id) ? ' checked' : '';
        h += '<div class="opt"><label><input type="' + (multi ? 'checkbox' : 'radio') + '" name="g' + g.id + '" data-g="' + g.id + '" data-m="' + m.id + '"' + checked + '><span>' + (Number(g.is_allergen) ? '⚠ ' : '') + esc(m.name) + '</span></label>' +
             (Number(m.extra_price) > 0 ? '<span class="xp">+' + fmt(m.extra_price) + '</span>' : '') + '</div>';
      }
      h += '</div>';
    }
    h += '<button class="paybtn" id="optadd">Add to order · ' + fmt(optPrice()) + '</button>';
    h += '<button class="morebtn" id="optcancel">Cancel</button>';
    h += '</div></div>';
    return h;
  }

  function optPrice() {
    let p = Number(optItem.price) || 0;
    for (const g of optGroups) for (const m of g.modifiers) if ((optSel[g.id] || []).includes(m.id)) p += Number(m.extra_price) || 0;
    return p;
  }

  function confirmOptions() {
    for (const g of optGroups) {
      if (Number(g.required) && !(optSel[g.id] || []).length) {
        alert('Please choose: ' + g.name); return;
      }
    }
    const chosen = [], names = [];
    for (const g of optGroups) for (const m of g.modifiers) if ((optSel[g.id] || []).includes(m.id)) { chosen.push(m.id); names.push(m.name); }
    pushCart(optItem, chosen, names);
    optItem = null; optGroups = null; optSel = {};
    render();
  }

  function pushCart(i, modIds, modNames) {
    // Same dish + same options = one line; different options = separate lines.
    const key = i.id + ':' + modIds.slice().sort().join(',');
    const existing = cart.find((c) => c.key === key);
    const unit = (Number(i.price) || 0) + modNames.reduce((a, n, idx) => a, 0) + modIds.reduce((a, id) => {
      for (const g of (modCache[i.id] || [])) for (const m of g.modifiers) if (m.id === id) return a + (Number(m.extra_price) || 0);
      return a;
    }, 0);
    if (existing) existing.quantity += 1;
    else cart.push({ uid: uidSeq++, key, menu_item_id: i.id, name: i.name, unit, quantity: 1, modifiers: modIds, modNames, item_note: '' });
  }

  function cartSheet() {
    let h = '<div class="sheet"><div class="panel"><h2>Your order — ' + esc(S.table.label) + '</h2>';
    for (const c of cart) {
      h += '<div class="cline"><div style="flex:1"><div class="nm">' + c.quantity + ' × ' + esc(c.name) + '</div>' +
        (c.modNames.length ? '<div class="ops">' + esc(c.modNames.join(', ')) + '</div>' : '') +
        '<input class="note-in" data-note="' + c.uid + '" placeholder="Any message for the kitchen? (allergy, spice level…)" value="' + esc(c.item_note || '') + '"></div>' +
        '<div style="text-align:right"><div class="pr">' + fmt(c.quantity * c.unit) + '</div>' +
        '<span class="step" style="margin-top:6px"><button data-dec="' + c.uid + '">−</button><span>' + c.quantity + '</span><button data-inc="' + c.uid + '">＋</button></span></div></div>';
    }
    h += '<div class="totrow"><span>Total</span><span>' + fmt(cartTotal()) + '</span></div>';
    h += '<div class="sp-bar"><span class="sp-name">Siam<b>Pay</b></span><span class="sp-sub">🔒 Secure checkout · powered by <b>Stripe</b></span></div>';
    h += '<div id="payel"></div>';
    // Real-card mode: the Stripe element mounts ASYNC (config → js.stripe.com →
    // payment-intent → mount). Until its 'ready' fires the button stays disabled,
    // or a fast first tap confirms an empty form ("card number is incomplete"
    // with no card form on screen — found in the P2 E2E test).
    h += '<button class="paybtn" id="paybtn"' + (S.stripe_ready ? ' disabled' : '') + '>' + (S.stripe_ready ? 'Loading secure payment…' : 'Send to kitchen (demo — no payment)') + '</button>';
    h += '<div class="muted">' + (S.stripe_ready ? 'Paid securely by card · Apple Pay · Google Pay' : 'Demo mode — payment is simulated') + '</div>';
    h += '<button class="morebtn" id="closecart">← Back to menu</button>';
    h += '</div></div>';
    return h;
  }

  function renderStatus() {
    const o = S.order;
    let h = '<header><h1>' + esc(S.restaurant_name) + '</h1><div class="tbl">📍 ' + esc(S.table.label) + '</div></header><div class="status-wrap">';
    if (!o) {
      h += '<div class="bigok">✅</div><div class="bigmsg">Order complete — thank you!</div><div class="bigsub">Everything has been served and paid. See you next time 🙏</div>';
      h += '<button class="morebtn" id="ordermore">Start a new order</button>';
      if (myPayments.length || lastOrderId) h += '<button class="morebtn" id="getreceipt">🧾 Get a receipt</button><div id="rcbox"></div>';
    } else {
      h += '<div class="bigok">👨‍🍳</div><div class="bigmsg">Your order is with the kitchen</div><div class="bigsub">Paid ✓ · this page updates itself</div><div style="margin-top:14px">';
      for (const it of (o.items || [])) {
        const st = it.status === 'served' ? 'served' : (it.status === 'cooked' ? 'cooked' : 'cooking');
        const lb = st === 'served' ? '✓ served' : st === 'cooked' ? 'ready' : 'cooking…';
        h += '<div class="sline"><span>' + it.quantity + ' × ' + esc(it.name) +
             (it.notes ? '<div class="ops">' + esc(it.notes) + '</div>' : '') +
             '</span><span class="st ' + st + '">' + lb + '</span></div>';
      }
      h += '</div><button class="morebtn" id="ordermore">＋ Order more</button>';
      h += '<button class="morebtn" id="getreceipt">🧾 Get a receipt</button>';
      h += '<div id="rcbox"></div>';
    }
    h += '</div>';
    $('#app').innerHTML = h;
    const om = $('#ordermore'); if (om) om.onclick = () => { view = 'menu'; cart = []; render(); };
    const rb = $('#getreceipt'); if (rb) rb.onclick = () => showReceipt();
  }

  function bind() {
    document.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => { activeCat = Number(b.dataset.cat); render(); });
    document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => { startAdd(Number(b.dataset.add)); });
    document.querySelectorAll('[data-inc]').forEach((b) => b.onclick = () => { bump(Number(b.dataset.inc), 1); });
    document.querySelectorAll('[data-dec]').forEach((b) => b.onclick = () => { bump(Number(b.dataset.dec), -1); });
    document.querySelectorAll('[data-note]').forEach((inp) => inp.onchange = () => {
      const c = cart.find((x) => x.uid === Number(inp.dataset.note)); if (c) c.item_note = inp.value.slice(0, 200);
    });
    document.querySelectorAll('#optsheet input').forEach((inp) => inp.onchange = () => {
      const g = Number(inp.dataset.g), m = Number(inp.dataset.m);
      const grp = optGroups.find((x) => x.id === g);
      if (Number(grp.multi_select)) {
        optSel[g] = optSel[g] || [];
        if (inp.checked) optSel[g].push(m); else optSel[g] = optSel[g].filter((x) => x !== m);
      } else {
        optSel[g] = [m];
      }
      const btn = $('#optadd'); if (btn) btn.textContent = 'Add to order · ' + fmt(optPrice());
    });
    const oa = $('#optadd'); if (oa) oa.onclick = confirmOptions;
    const oc = $('#optcancel'); if (oc) oc.onclick = () => { optItem = null; optGroups = null; optSel = {}; render(); };
    const cb = $('#cartbar'); if (cb) cb.onclick = () => { if (view !== 'cart') { view = 'cart'; render(); openPayment(); } };
    const cc = $('#closecart'); if (cc) cc.onclick = () => { view = 'menu'; render(); };
    const pb = $('#paybtn'); if (pb) pb.onclick = submit;
  }

  function findItem(id) { for (const c of MENU) { const i = (c.items || []).find((x) => x.id === id); if (i) return i; } return null; }
  function bump(uid, d) {
    const c = cart.find((x) => x.uid === uid); if (!c) return;
    c.quantity += d; if (c.quantity <= 0) cart = cart.filter((x) => x !== c);
    if (!cart.length && view === 'cart') view = 'menu';
    render(); if (view === 'cart') openPayment();
  }

  // ── Stripe (only when the restaurant has keys — otherwise mock) ───────────
  async function openPayment() {
    if (!S.stripe_ready || !cart.length) return;
    try {
      let acct = null;
      if (!stripePk) {
        const cfg = await fetch('/api/takeaway/stripe-config').then((r) => r.json());
        stripePk = cfg.publishable_key || cfg.publishableKey;
        acct = cfg.stripe_account || null;
        if (!window.Stripe) await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://js.stripe.com/v3/'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
        stripe = acct ? window.Stripe(stripePk, { stripeAccount: acct }) : window.Stripe(stripePk);
      }
      const pi = await fetch('/api/qr/payment-intent/' + token, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: cart.map((c) => ({ menu_item_id: c.menu_item_id, quantity: c.quantity, modifiers: c.modifiers })) }) }).then((r) => r.json());
      if (pi.error) { $('#payel').innerHTML = '<div class="err">' + esc(pi.error) + '</div>'; return; }
      window.__qr_pi = pi;
      elements = stripe.elements({ clientSecret: pi.client_secret });
      const payEl = elements.create('payment');
      payEl.mount('#payel');
      payEl.on('ready', () => {
        const pb = $('#paybtn');
        if (pb && !payBusy) { pb.disabled = false; pb.textContent = 'Pay ' + fmt(cartTotal()) + ' & send to kitchen'; }
      });
    } catch (e) { $('#payel').innerHTML = '<div class="err">Card form failed to load — please try again.</div>'; }
  }

  async function submit() {
    if (payBusy || !cart.length) return;
    payBusy = true; const pb = $('#paybtn'); pb.disabled = true; pb.textContent = 'Sending…';
    try {
      let piId = null;
      if (S.stripe_ready) {
        if (!elements) throw new Error('The card form is still loading — one moment.');
        const { error } = await stripe.confirmPayment({ elements, redirect: 'if_required' });
        if (error) throw new Error(error.message || 'Payment failed');
        piId = window.__qr_pi.payment_intent_id;
      }
      const r = await fetch('/api/qr/orders/' + token, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: cart.map((c) => ({ menu_item_id: c.menu_item_id, quantity: c.quantity, modifiers: c.modifiers, item_note: c.item_note })), payment_intent_id: piId }) }).then((x) => x.json());
      if (r.error) throw new Error(r.error);
      // SEPOS-QR-RECEIPT-001 — Korakot: "they pay when they place the order, so
      // the receipt should come with the payment." Keep the tender id THIS
      // phone was given; the receipt is then for what this person paid, which
      // is what makes it correct when four people share one table.
      if (r.payment_id) {
        myPayments.push(r.payment_id);
        try { sessionStorage.setItem('qr_pays_' + token, JSON.stringify(myPayments)); } catch (e) {}
      }
      cart = []; view = 'status';
      const s = await fetch('/api/qr/session/' + token).then((x) => x.json());
      if (!s.error) S.order = s.order;
      render();
    } catch (e) {
      payBusy = false;
      const pb2 = $('#paybtn'); if (pb2) { pb2.disabled = false; pb2.textContent = 'Try again'; }
      // One error banner at a time — repeat failures were stacking duplicates.
      document.querySelectorAll('.panel > .err').forEach((n) => n.remove());
      const pe = $('#payel'); if (pe) pe.insertAdjacentHTML('beforebegin', '<div class="err">' + esc(e.message) + '</div>');
      return;
    }
    payBusy = false;
  }

  // ── Receipt ────────────────────────────────────────────────────────────────
  async function showReceipt(pickPayment) {
    const box = $('#rcbox'); if (!box) return;
    box.innerHTML = '<div class="muted" style="margin-top:14px">Loading your receipt…</div>';
    try {
      // Verify pass (MEDIUM) — a phone that paid several rounds could only ever
      // see the last one. Offer each round it paid for.
      const mine = pickPayment || (myPayments.length ? myPayments[myPayments.length - 1] : null);
      const allMine = myPayments.slice();
      const oid = (S.order && S.order.id) || lastOrderId;
      let q = oid ? ('?order_id=' + oid) : '';
      if (mine) q += (q ? '&' : '?') + 'payment_id=' + mine;
      const r = await fetch('/api/qr/receipt/' + token + q).then((x) => x.json());
      if (r.error) { box.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; }
      const cur = (r.restaurant && r.restaurant.currency) || '£';
      let h = '<div class="rc"><h3>' + esc(r.restaurant.name) + '</h3>';
      if (r.restaurant.address) h += '<div class="meta">' + esc(r.restaurant.address) + '</div>';
      if (r.restaurant.phone)   h += '<div class="meta">Tel: ' + esc(r.restaurant.phone) + '</div>';
      if (r.restaurant.vat)     h += '<div class="meta">VAT No: ' + esc(r.restaurant.vat) + '</div>';
      h += '<div class="meta" style="margin-top:8px">Order #' + r.order_id + ' · ' + esc(r.table) +
           (r.scoped_to_payment ? ' · your order' : '') + '</div>';
      for (const i of (r.items || [])) {
        h += '<div class="line"><span>' + i.quantity + ' × ' + esc(i.name) +
             (i.notes ? '<div style="font-size:11.5px;color:#888">' + esc(i.notes) + '</div>' : '') +
             '</span><span>' + cur + (Number(i.unit_price) * Number(i.quantity)).toFixed(2) + '</span></div>';
      }
      h += '<div class="tot"><span>Total</span><span>' + cur + Number(r.total || 0).toFixed(2) + '</span></div>';
      for (const p of (r.payments || [])) {
        h += '<div class="line" style="border:none;color:#666;font-size:12.5px"><span>' + esc(p.method) + '</span><span>' + cur + Number(p.amount).toFixed(2) + '</span></div>';
      }
      if (allMine.length > 1) {
        h += '<div class="meta" style="margin-top:10px">You paid ' + allMine.length + ' times at this table:';
        allMine.forEach(function (pid, i) {
          h += ' <a href="#" data-rcpay="' + pid + '" style="color:var(--brand);font-weight:700">round ' + (i + 1) + (pid === mine ? ' (shown)' : '') + '</a>';
        });
        h += '</div>';
      }
      h += '<div class="em"><input id="rcmail" type="email" inputmode="email" placeholder="Email it to me (optional)"><button id="rcsend">Send</button></div>';
      h += '<button class="morebtn" id="rcclose" style="margin-top:10px">Close receipt</button>';
      h += '<div id="rcmsg" class="muted" style="text-align:left"></div>';
      h += '</div>';
      box.innerHTML = h;
      document.querySelectorAll('[data-rcpay]').forEach(function (a) {
        a.onclick = function (e) { e.preventDefault(); showReceipt(Number(a.dataset.rcpay)); };
      });
      const cb = $('#rcclose'); if (cb) cb.onclick = () => { box.innerHTML = ''; };
      const sendBtn = $('#rcsend');
      if (sendBtn) sendBtn.onclick = async () => {
        const email = ($('#rcmail') || {}).value || '';
        const msg = $('#rcmsg');
        sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
        try {
          const res = await fetch('/api/qr/receipt/' + token + '/email', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, order_id: r.order_id, payment_id: mine || undefined }),
          }).then((x) => x.json());
          if (res.error) { msg.textContent = res.error; sendBtn.disabled = false; sendBtn.textContent = 'Send'; return; }
          msg.textContent = '✓ Sent — check your inbox.';
          sendBtn.textContent = 'Sent';
        } catch (e) {
          msg.textContent = 'Could not send it — please ask a member of staff.';
          sendBtn.disabled = false; sendBtn.textContent = 'Send';
        }
      };
    } catch (e) { box.innerHTML = '<div class="err">Could not load your receipt.</div>'; }
  }

  boot();
})();
</script>
</body>
</html>
