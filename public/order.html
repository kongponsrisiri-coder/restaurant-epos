<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order online</title>
<!-- SEPOS-ORDER-UNIFY-001 (Korakot, 30 Aug) — ONE ordering UI everywhere.
     This hosted page now opens the SAME takeaway widget that client websites
     embed, so a Google-link customer and a website customer get an identical
     flow, and every ordering improvement ships once. The previous standalone
     UI is preserved at /order-legacy for instant comparison/rollback. -->
<style>
  :root { --brand:#1E4038; --bg:#f6f4ef; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,system-ui,'Segoe UI',sans-serif; background:var(--bg); color:#1a1a2e; min-height:100vh; }
  header { background:var(--brand); color:#fff; padding:18px 16px; text-align:center; }
  header h1 { font-size:19px; font-weight:800; }
  header .sub { font-size:13px; opacity:.85; margin-top:3px; }
  .wrap { max-width:480px; margin:0 auto; padding:30px 16px 60px; text-align:center; }
  .startbtn { display:inline-block; background:var(--brand); color:#fff; border:none; border-radius:14px;
    font-weight:800; font-size:17px; padding:16px 30px; cursor:pointer; margin-top:16px; }
  .note { color:#777; font-size:13.5px; margin-top:16px; line-height:1.6; }
</style>
</head>
<body>
<header><h1 id="rn">Order online</h1><div class="sub" id="rs"></div></header>
<div class="wrap">
  <button class="startbtn" data-siamepos-takeaway>🥡 Start your order</button>
  <div class="note" id="hint">The menu opens automatically — if it doesn’t, tap the button above.</div>
</div>
<script>
(function () {
  fetch('/api/settings').then(function (r) { return r.json(); }).catch(function () { return {}; })
    .then(function (st) {
      var name = st.company_name || st.restaurant_name || '';
      if (name) {
        document.getElementById('rn').textContent = name;
        document.getElementById('rs').textContent = 'Order for collection — freshly cooked to order';
        document.title = name + ' — order online';
      }
      if (st.brand_primary) document.documentElement.style.setProperty('--brand', st.brand_primary);
      var s = document.createElement('script');
      s.src = '/takeaway-widget.js';
      s.setAttribute('data-auto-open', '1');
      document.body.appendChild(s);
    });
})();
</script>
</body>
</html>
